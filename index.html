<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf9f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="小麦的成长计划" />
    <meta
      name="description"
      content="从出生到周岁，按成长时间线、家里的场景和育儿问题，翻开小麦的家庭手账。"
    />
    <title>小麦的成长计划</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="mast">
      <div class="wrap mast-in">
        <a class="brand" href="#home"
          ><img
            src="./assets/icon-192.png"
            alt=""
            width="36"
            height="36"
          /><span>小麦的成长计划</span></a
        >
        <nav aria-label="主导航">
          <a href="#home" data-view="home"><i data-icon="path"></i>成长时间线</a
          ><a href="#index" data-view="index"
            ><i data-icon="index"></i>知识索引</a
          ><a href="#notes" data-view="notes"
            ><i data-icon="note"></i>我家的经验</a
          >
        </nav>
        <button class="tools" id="tools-button">
          <i data-icon="settings"></i><span>安装与备份</span>
        </button>
      </div>
    </header>
    <main class="wrap">
      <section id="home" aria-labelledby="cover-title">
        <header class="cover">
          <div class="cover-text">
            <span class="cover-age">出生 — 周岁</span>
            <h1 id="cover-title">
              小麦的<span class="title-unit">第一年</span>
            </h1>
            <a class="cover-search" href="#index"
              ><i data-icon="search"></i>查一个育儿问题</a
            >
          </div>
          <div class="cover-art">
            <img
              src="./assets/wheat-field.webp"
              alt="爸爸抱着小麦坐在麦田边，小麦伸手去摸麦穗。"
              fetchpriority="high"
            />
          </div>
          <b class="seed" aria-hidden="true"></b>
        </header>
        <section class="timeline" aria-labelledby="timeline-title">
          <div class="section-head">
            <h2 id="timeline-title">成长时间线</h2>
            <div class="arrows">
              <button id="prev-stage" class="round" aria-label="上一个月龄阶段">
                <i data-icon="left"></i></button
              ><button
                id="next-stage"
                class="round"
                aria-label="下一个月龄阶段"
              >
                <i data-icon="right"></i>
              </button>
            </div>
          </div>
          <ol id="stages" class="stages" aria-label="按月龄顺序选择阶段"></ol>
          <article id="phase" class="phase" aria-label="所选月龄的照护重点">
            <div class="phase-intro">
              <span class="age-tag" id="phase-age"></span>
              <h3 id="phase-title">正在打开手账…</h3>
              <p id="phase-focus"></p>
              <a id="all-stage" class="phase-link">本阶段全部卡片</a>
            </div>
            <div class="phase-cards" id="featured"></div>
          </article>
        </section>
      </section>
      <section id="index" hidden aria-labelledby="index-title">
        <header class="sub-head">
          <div>
            <h1 id="index-title">知识索引</h1>
            <p id="index-caption" class="muted"></p>
          </div>
          <button class="quiet" data-resources>内容来源</button>
        </header>
        <div class="index-tools">
          <label class="search"
            ><i data-icon="search"></i
            ><input
              id="search"
              type="search"
              placeholder="搜问题、家里的说法或材料"
              aria-label="搜索知识索引"
          /></label>
          <details id="filter-panel">
            <summary>
              <i data-icon="filter"></i><span id="filter-label">筛选</span>
            </summary>
            <div class="filter-fields" id="filter-fields"></div>
          </details>
          <div class="hints" id="quick-search" aria-label="常用搜索"></div>
        </div>
        <div class="result-head">
          <span id="match-count" role="status"></span
          ><button id="clear" class="quiet" hidden>清除条件</button>
        </div>
        <div class="results" id="results"></div>
      </section>
      <section id="notes" hidden aria-labelledby="notes-title">
        <header class="sub-head">
          <div>
            <h1 id="notes-title">我家的经验</h1>
            <p class="muted" id="note-count">保存在这台设备</p>
          </div>
        </header>
        <div id="notes-list"></div>
      </section>
      <p id="notice" role="status"></p>
      <noscript>请启用浏览器 JavaScript 打开手账。</noscript>
    </main>
    <dialog id="card-dialog" aria-labelledby="detail-title">
      <article class="dialog-body">
        <header class="dialog-top">
          <span id="detail-stage" class="age-tag"></span
          ><button class="favorite" id="favorite-card" aria-pressed="false">
            <i data-icon="bookmark"></i><span>收藏</span></button
          ><button data-close class="round" aria-label="关闭卡片">
            <i data-icon="close"></i>
          </button>
        </header>
        <h2 id="detail-title"></h2>
        <div id="detail-content"></div>
        <details id="entry" class="entry">
          <summary><i data-icon="note"></i>我家的经验</summary>
          <label id="note-prompt" for="experience"></label
          ><textarea
            id="experience"
            rows="3"
            placeholder="在这里写下这次观察…"
          ></textarea
          ><small id="save-state" role="status"></small>
        </details>
        <div id="related" class="related"></div>
      </article>
    </dialog>
    <dialog id="resources-dialog" aria-labelledby="resources-title">
      <article class="dialog-body">
        <header class="dialog-top">
          <h2 id="resources-title">内容来源</h2>
          <button data-close class="round" aria-label="关闭来源">
            <i data-icon="close"></i>
          </button>
        </header>
        <div id="sources-list"></div>
      </article>
    </dialog>
    <dialog id="tools-dialog" aria-labelledby="tools-title">
      <article class="dialog-body">
        <header class="dialog-top">
          <h2 id="tools-title">安装与备份</h2>
          <button data-close class="round" aria-label="关闭设置">
            <i data-icon="close"></i>
          </button>
        </header>
        <h3>添加到主屏幕</h3>
        <p id="install-guide"></p>
        <button id="install" class="solid" hidden>安装手账</button>
        <p id="offline-status" class="muted"></p>
        <hr />
        <h3>我家的经验</h3>
        <p>换手机、换浏览器或清理数据前，可先导出备份。导入会合并记录。</p>
        <div class="actions">
          <button id="export" class="solid">导出经验</button
          ><button id="import" class="tools">导入备份</button
          ><input
            id="import-file"
            type="file"
            accept=".json,application/json"
            hidden
          />
        </div>
        <p id="backup-message" role="status"></p>
      </article>
    </dialog>
  </body>
</html>
