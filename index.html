<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f6ef"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="小麦的成长计划">
  <meta name="description" content="小麦的第一年育儿手账。按月龄读育儿卡片，在自己的手机记下照护经验。">
  <title>小麦的成长计划</title>
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon-192.png"><link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="stylesheet" href="./styles.css"><script type="module" src="./app.js"></script>
</head>
<body>
  <header class="mast"><div class="wrap mast-inner">
    <a class="brand" href="#home"><img src="./assets/icon-192.png" alt="" width="38" height="38"><span>小麦的成长计划</span></a>
    <nav aria-label="主导航"><a href="#home" data-route="home">月龄手账</a><a href="#notes" data-route="notes">我家的经验</a></nav>
    <button id="tools-button" class="outline"><span class="ui-icon" data-icon="install"></span><span>安装与备份</span></button>
  </div></header>
  <main class="wrap">
    <section id="home">
      <div class="hero">
        <div class="hero-copy"><span class="year-mark"><i class="sun-dot"></i> 小麦的第一年</span>
          <h1>小麦的<br><em>成长计划</em></h1>
          <p>给小麦，把一起长大的日子慢慢记下来。</p>
          <button id="start" class="primary"><span data-icon="book"></span><span>翻开月龄手账</span></button>
        </div>
        <div class="cover"><img src="./assets/wheat-field.webp" alt="绘本里的爸爸抱着戴麦芽帽的小麦，坐在麦田边看一只小鸟。" fetchpriority="high"></div>
        <span class="drifting seed-a" aria-hidden="true"></span><span class="drifting seed-b" aria-hidden="true"></span>
      </div>
      <section id="journal" aria-labelledby="journal-title">
        <div class="section-head"><div><h2 id="journal-title">月龄手账</h2><p id="collection-count" class="muted">按月龄翻阅育儿卡片</p></div>
          <label class="search"><span data-icon="search"></span><input id="search" type="search" aria-label="搜索所有月龄的育儿卡片" placeholder="搜问题，如黄疸、睡眠"></label></div>
        <div id="stages" aria-label="选择月龄" class="stages"></div>
        <div class="journal-layout">
          <section class="card-section"><header class="chapter-head"><div class="stage-symbol" aria-hidden="true" data-icon="sprout"></div><div><h3 id="chapter">正在打开手账…</h3><p id="chapter-description" class="muted" aria-live="polite"></p></div></header><div id="card-list"></div></section>
          <aside class="memo"><div class="memo-head"><span class="notebook-icon" data-icon="pencil"></span><h3>我家的经验</h3></div><p id="memo-lead"></p><div id="recent"></div><a class="text-link" href="#notes">打开经验本</a></aside>
        </div>
      </section>
    </section>
    <section id="notes" hidden aria-labelledby="notes-title"><div class="notes-header"><span class="year-mark"><i class="sun-dot"></i> 小麦的第一年</span><h1 id="notes-title">我家的经验</h1><p>记在这台设备上的照护心得。</p></div><div id="notes-list"></div></section>
    <noscript>请启用浏览器的 JavaScript 后打开小麦的手账。</noscript>
    <p id="notice" role="status"></p>
    <footer><span>小麦的成长计划</span><span>家庭育儿手账 · 第一年</span></footer>
  </main>
  <dialog id="card-dialog"><article class="dialog-inner"><header class="dialog-top"><span id="detail-stage" class="year-mark"></span><button class="icon-button" aria-label="关闭卡片" data-close data-icon="close"></button></header><h2 id="detail-title"></h2>
    <h3>为什么</h3><p id="detail-reason"></p><h3>具体怎么做</h3><div id="detail-steps"></div>
    <a id="detail-ref" class="reference" target="_blank" rel="noreferrer">查看本条参考资料 ↗</a>
    <div class="entry"><label for="experience">我家的经验</label><textarea id="experience" rows="4" placeholder="今天试了什么？小麦有什么反应？"></textarea><p id="save-state" role="status"></p></div>
  </article></dialog>
  <dialog id="tools-dialog"><article class="dialog-inner"><header class="dialog-top"><h2>安装与备份</h2><button class="icon-button" aria-label="关闭设置" data-close data-icon="close"></button></header>
    <h3>添加到主屏幕</h3><p id="install-guide"></p><button id="install" class="primary" hidden>安装小麦的成长计划</button>
    <p id="offline-status" class="helper"></p><hr><h3>备份我家的经验</h3>
    <p>经验保存在当前浏览器或主屏幕应用里。换手机、换浏览器或清理数据前，请先导出备份。</p>
    <div class="actions"><button id="export" class="primary">导出经验</button><button id="import" class="outline">导入备份</button><input id="import-file" type="file" accept=".json,application/json" hidden></div>
    <p class="helper">导入时会合并记录。同一卡片的两份不同内容都会保留。</p><p id="backup-message" role="status"></p>
  </article></dialog>
</body>
</html>
